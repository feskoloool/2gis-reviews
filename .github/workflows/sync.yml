name: Sync 2GIS Reviews

on:
  schedule:
    # Запуск раз в сутки в 03:00 по Москве (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Кнопка для ручного запуска в любое время

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python fetch_reviews.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git diff --staged --quiet || (git commit -m "Auto-update 2GIS reviews" && git push)
